name: Feature request
description: Explain a useful capability or workflow improvement.
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task and who would benefit, without personal library data.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Describe how you would use it and any alternatives you have considered.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Privacy, storage or performance considerations
