name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIG_DIR: .test-config
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: find web/js -name '*.js' -exec node --check {} \;
      - run: python tools/check_release.py
      - run: pip-audit -r requirements.txt
      - name: Record resolved dependencies in the CI log
        run: pip freeze --all
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build fresh image and verify models
        run: docker build --pull -t supergallery:ci .
      - name: Check first-run configuration
        run: |
          mkdir -p /tmp/sg-ci-library /tmp/sg-ci-config
          NAS_HOST=localhost LIBRARY_PATH=/tmp/sg-ci-library CONFIG_PATH=/tmp/sg-ci-config docker compose config --quiet
          docker run -d --name sg-smoke --cap-drop ALL --security-opt no-new-privileges:true supergallery:ci
          for attempt in $(seq 1 40); do
            if docker exec sg-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/api/auth')"; then break; fi
            sleep 2
          done
          docker exec sg-smoke python tools/download_models.py --verify-only
          docker cp tools/container_smoke.py sg-smoke:/tmp/container_smoke.py
          docker exec sg-smoke python /tmp/container_smoke.py
          docker exec sg-smoke pip freeze --all
      - name: Container logs on failure
        if: failure()
        run: docker logs --tail=100 sg-smoke || true
      - name: Cleanup disposable container
        if: always()
        run: docker rm -f sg-smoke || true
  publish:
    # Only tested commits on main and version tags reach the registry; pull requests never publish.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, container]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/supergallery
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=SuperGallery
            org.opencontainers.image.description=Private photo gallery, smart search and file manager for your NAS
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.authors=Sai Krishna Daddala
            org.opencontainers.image.vendor=Sai Krishna Daddala
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, container, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build committed source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release_archive.py "$RELEASE_TAG"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "SuperGallery $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
